name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 先装 pnpm，注意顺序：必须在 setup-node 之前
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # 2. 装 Node，cache: pnpm 会按 pnpm-lock.yaml 缓存依赖
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 3. 配置 Pages
      - id: pages
        uses: actions/configure-pages@v5

      # 4. 安装依赖：--frozen-lockfile 保证和本地锁文件一致
      #    前提是 pnpm-lock.yaml 已提交到仓库
      - run: pnpm install --frozen-lockfile

      # 5. 编译
      - run: pnpm run build

      # 6. 上传构建产物，path 改成你实际的输出目录
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 7. 发布
      - id: deployment
        uses: actions/deploy-pages@v4
